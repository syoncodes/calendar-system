<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#232455">
<title>Fall 2026 — The System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Arvo:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#232455; --bg2:#3A2E6E; --bg3:#1B2B63;
  --glass:rgba(255,255,255,.09); --glass2:rgba(255,255,255,.13);
  --stroke:rgba(255,255,255,.22); --stroke-hi:rgba(255,255,255,.45);
  --txt:#FFFFFF; --mut:rgba(255,255,255,.62); --faint:rgba(255,255,255,.4);
  --cyan:#43D6F0; --blue:#4A7DFF; --violet:#8A6CFF;
  --class:#FF5C7A; --study:#5B9BFF; --research:#B07CFF; --startup:#43E0C0; --gym:#54E88F; --personal:rgba(255,255,255,.55); --transit:rgba(255,255,255,.3);
  --exam:#FF5C7A; --hw:#5B9BFF; --brk:#54E88F; --fly:#43D6F0; --adm:rgba(255,255,255,.4); --mile:#FFC24D;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg1)}
body{font-family:'Arvo',Georgia,serif;color:var(--txt);padding:28px 16px 70px;min-height:100vh;min-height:100svh;position:relative;overflow-x:hidden}
/* gradient lives on a fixed pseudo-element — background-attachment:fixed is broken on iOS Safari.
   body must stay background-less or it paints over the z-index:-1 layer (html carries the fallback) */
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(135deg,#2B2D5B 0%,#3A2E6E 38%,#22336B 72%,#182A5C 100%)}
/* iOS Safari only synthesizes click events on "clickable" elements — this makes tap-away dismissal work everywhere */
@media(hover:none){body{cursor:pointer}}

/* ---- ambient ribbons & glow ---- */
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55}
.b1{width:520px;height:520px;background:radial-gradient(circle,#43D6F0 0%,transparent 65%);top:-140px;right:-100px}
.b2{width:620px;height:620px;background:radial-gradient(circle,#4A7DFF 0%,transparent 65%);bottom:-220px;left:-160px;opacity:.4}
.b3{width:380px;height:380px;background:radial-gradient(circle,#8A6CFF 0%,transparent 65%);top:38%;left:52%;opacity:.3}
.ribbon{position:absolute;inset:0;width:100%;height:100%}
.shell{max-width:1240px;margin:0 auto;position:relative;z-index:1}

/* ---- header ---- */
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--cyan);font-weight:500}
h1{font-weight:700;font-size:clamp(26px,4.4vw,42px);letter-spacing:.01em;margin:6px 0 4px;text-shadow:0 2px 24px rgba(67,214,240,.35)}
.sub{font-size:13px;color:var(--mut);font-weight:400}
.chiprow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.countdown{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:8px 18px;font-size:12.5px;
  background:linear-gradient(120deg,rgba(74,125,255,.85),rgba(67,214,240,.85));box-shadow:0 6px 24px rgba(74,125,255,.4);font-weight:400}
.countdown b{font-weight:700}
#nowchip{background:linear-gradient(120deg,rgba(67,224,192,.9),rgba(84,232,143,.82));box-shadow:0 6px 24px rgba(67,224,192,.35);color:#0A2A22}
#nowchip b{color:#06201a}
#nowchip:empty{display:none}

/* ---- glass primitives ---- */
.glass{background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--stroke);border-top-color:var(--stroke-hi);border-left-color:rgba(255,255,255,.32);
  border-radius:20px;box-shadow:0 10px 36px rgba(10,12,40,.42)}

/* ---- tabs ---- */
.tabs{display:flex;gap:6px;margin:22px 0 18px;padding:6px;width:max-content;max-width:100%;border-radius:999px;
  background:rgba(255,255,255,.07);backdrop-filter:blur(14px);border:1px solid var(--stroke)}
.tab{border:none;background:transparent;font-family:inherit;font-weight:600;font-size:13px;padding:9px 22px;border-radius:999px;cursor:pointer;color:var(--mut);transition:all .2s}
.tab.on{background:linear-gradient(120deg,var(--blue),var(--cyan));color:#fff;box-shadow:0 4px 18px rgba(74,125,255,.5)}
.view{display:none;animation:fade .3s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---- week ---- */
.legend{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.lg{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--mut);border-radius:999px;padding:5px 13px;
  background:rgba(255,255,255,.07);backdrop-filter:blur(10px);border:1px solid var(--stroke)}
.lg i{width:8px;height:8px;border-radius:50%;box-shadow:0 0 8px currentColor}
.wkwrap{overflow:hidden}
.wkscroll{overflow-x:auto}
.wkgrid{display:grid;grid-template-columns:52px repeat(7,minmax(146px,1fr));min-width:1100px}
.corner{border-bottom:1px solid var(--stroke);position:sticky;left:0;z-index:5;background:rgba(32,33,76,.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.dh{border-bottom:1px solid var(--stroke);border-left:1px solid rgba(255,255,255,.09);padding:12px 10px 10px}
.dh .d{font-weight:600;font-size:13.5px}
.dh .th{font-size:9.5px;color:var(--faint);margin-top:1px;font-weight:400;letter-spacing:.02em}
.dh.today{box-shadow:inset 0 -2px 0 var(--cyan)}
.dh.today .d{color:var(--cyan);text-shadow:0 0 12px rgba(67,214,240,.6)}
.dh .dd{font-size:9.5px;color:var(--mut);font-weight:400;margin-left:6px}
.dh .tag{display:inline-block;font-size:8px;font-weight:700;letter-spacing:.04em;border-radius:5px;padding:1.5px 6px;margin:4px 4px 0 0}
.tag.cr{background:rgba(255,92,122,.28);color:#FFB3C1}
.tag.noclass{background:rgba(84,232,143,.25);color:#9FF0C0}
.tag.eve{background:rgba(67,214,240,.22);color:#A8EBF7}
.evp{display:block;font-size:8.5px;font-weight:600;border-radius:6px;padding:2px 6px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#101433}
.ruler{position:sticky;left:0;z-index:4;background:rgba(32,33,76,.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.hl{position:absolute;right:8px;transform:translateY(-6px);font-size:9.5px;color:var(--faint);font-weight:400}
.col{position:relative;border-left:1px solid rgba(255,255,255,.09)}
.gl{position:absolute;left:0;right:0;border-top:1px solid rgba(255,255,255,.07)}
.sleep{position:absolute;left:0;right:0;border-top:2px dashed rgba(255,92,122,.6)}
.nowline{position:absolute;left:0;right:0;z-index:3;border-top:2px solid var(--cyan);box-shadow:0 0 10px rgba(67,214,240,.8);pointer-events:none}
.nowline::before{content:"";position:absolute;left:-1px;top:-4px;width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.blk.now{border-color:rgba(67,214,240,.9);animation:nowpulse 2.6s ease-in-out infinite}
@keyframes nowpulse{
  0%,100%{box-shadow:0 0 0 1.5px rgba(67,214,240,.75),0 0 20px rgba(67,214,240,.35)}
  50%{box-shadow:0 0 0 1.5px rgba(67,214,240,.4),0 0 10px rgba(67,214,240,.12)}
}
.blk{position:absolute;left:4px;right:4px;border-radius:10px;padding:5px 8px;overflow:hidden;line-height:1.18;cursor:pointer;
  backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.14);border-top-color:rgba(255,255,255,.3);
  box-shadow:0 4px 14px rgba(10,12,40,.25)}
.blk .t{font-weight:600;font-size:10.5px}
.blk .m{font-size:8.5px;opacity:.68;margin-top:1px;font-weight:400}
.blk.thin{padding:2px 8px}.blk.thin .t{font-size:9px;font-weight:400}
.c-class{background:linear-gradient(150deg,rgba(255,92,122,.36),rgba(255,92,122,.14))}
.c-study{background:linear-gradient(150deg,rgba(91,155,255,.36),rgba(91,155,255,.13))}
.c-research{background:linear-gradient(150deg,rgba(176,124,255,.36),rgba(176,124,255,.13))}
.c-startup{background:linear-gradient(150deg,rgba(67,224,192,.34),rgba(67,224,192,.12))}
.c-gym{background:linear-gradient(150deg,rgba(84,232,143,.32),rgba(84,232,143,.11))}
.c-personal{background:rgba(255,255,255,.09)}
.c-transit{background:repeating-linear-gradient(-45deg,rgba(255,255,255,.09) 0 5px,rgba(255,255,255,.02) 5px 10px);border-style:dashed}
/* dated one-off events overlaid on the week grid */
.evblk{position:absolute;left:10px;right:2px;z-index:2;border-radius:9px;padding:3px 7px;overflow:hidden;line-height:1.15;cursor:pointer;
  border:1.5px solid;box-shadow:0 6px 18px rgba(5,8,30,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.evblk .t{font-weight:700;font-size:9.5px}
.evblk .m{font-size:8.5px;opacity:.78;font-weight:400}
.ek-exam{background:rgba(255,92,122,.55);border-color:var(--exam)}
.ek-hw{background:rgba(91,155,255,.5);border-color:var(--hw)}
.ek-mile{background:rgba(255,194,77,.45);border-color:var(--mile)}
.ek-fly{background:rgba(67,214,240,.5);border-color:var(--fly)}
.ek-brk{background:rgba(84,232,143,.45);border-color:var(--brk)}
.ek-adm{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.5)}

/* ---- month ---- */
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.mtitle{font-weight:700;font-size:22px}
.nav{display:flex;gap:8px}
.nbtn{border:1px solid var(--stroke);background:rgba(255,255,255,.08);backdrop-filter:blur(10px);border-radius:12px;width:38px;height:38px;font-size:17px;cursor:pointer;color:#fff;transition:all .2s}
.nbtn:hover{background:linear-gradient(120deg,var(--blue),var(--cyan));box-shadow:0 4px 16px rgba(74,125,255,.5)}
.nbtn.wide{width:auto;padding:0 14px;font-size:12px;font-family:inherit;font-weight:600}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.dow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);text-align:center;padding:4px 0;font-weight:500}
.cell{min-height:90px;padding:8px 8px;cursor:pointer;position:relative;overflow:hidden;border-radius:14px;
  background:rgba(255,255,255,.07);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.15);border-top-color:rgba(255,255,255,.3);
  transition:transform .16s, box-shadow .16s, background .16s}
.cell:hover{transform:translateY(-2px);background:rgba(255,255,255,.13);box-shadow:0 8px 24px rgba(10,12,40,.4)}
.cell.today{border:1.5px solid var(--cyan);box-shadow:0 0 20px rgba(67,214,240,.35)}
.cell.brkday{background:rgba(84,232,143,.1)}
.cell.crunch{background:rgba(255,92,122,.12)}
.cell .num{font-weight:600;font-size:12.5px}
.cell.today .num{color:var(--cyan)}
.pill{display:block;font-size:8.5px;font-weight:600;border-radius:6px;padding:2px 6px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#101433}
.p-exam{background:var(--exam);color:#fff}.p-hw{background:var(--hw);color:#fff}.p-brk{background:var(--brk)}.p-fly{background:var(--fly)}.p-adm{background:rgba(255,255,255,.28);color:#fff}.p-mile{background:var(--mile)}
.dots{display:flex;gap:3px;margin-top:5px}
.dots i{width:5px;height:5px;border-radius:50%;box-shadow:0 0 6px currentColor}

/* ---- drawer ---- */
.ov{position:fixed;inset:0;background:rgba(10,12,36,.55);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .22s;z-index:40}
.ov.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:12px;right:12px;bottom:12px;width:min(400px,92vw);z-index:50;transform:translateX(110%);transition:transform .28s cubic-bezier(.3,.9,.3,1);padding:24px 22px;overflow-y:auto;border-radius:22px;
  background:linear-gradient(160deg,rgba(58,46,110,.9),rgba(27,43,99,.92));backdrop-filter:blur(22px);border:1px solid var(--stroke);border-top-color:var(--stroke-hi);box-shadow:0 20px 60px rgba(5,8,30,.6)}
.drawer.on{transform:none}
.dr-date{font-weight:700;font-size:21px;line-height:1.1;padding-right:36px}
.dr-sub{font-size:10.5px;color:var(--faint);margin:5px 0 16px;font-weight:400;letter-spacing:.03em}
.dr-x{position:absolute;top:16px;right:16px;border:1px solid var(--stroke);background:rgba(255,255,255,.1);width:32px;height:32px;border-radius:10px;cursor:pointer;font-size:14px;color:#fff}
.dr-sec{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:16px 0 7px;font-weight:500}
.dr-pill{font-size:11.5px;font-weight:600;border-radius:10px;padding:8px 12px;margin-bottom:6px;color:#101433;box-shadow:0 4px 14px rgba(10,12,40,.3)}
.dr-ev{display:flex;gap:10px;border-radius:12px;padding:8px 11px;margin-bottom:6px;align-items:flex-start;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-top-color:rgba(255,255,255,.26)}
.dr-ev i{width:4px;align-self:stretch;border-radius:3px;flex:none;box-shadow:0 0 8px currentColor}
.dr-ev .tt{font-size:12px;font-weight:500}
.dr-ev .tm{font-size:10px;color:var(--faint);font-weight:400}
.dr-none{font-size:12.5px;color:var(--mut);border:1px dashed var(--stroke);border-radius:12px;padding:12px;font-weight:400}

/* ---- semester ---- */
.sem{display:flex;flex-direction:column;gap:9px}
.wk{display:grid;grid-template-columns:112px 1fr;gap:12px;padding:13px 16px;align-items:center;border-radius:16px;cursor:pointer;
  background:rgba(255,255,255,.07);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.15);border-top-color:rgba(255,255,255,.28);transition:background .16s}
.wk:hover{background:rgba(255,255,255,.11)}
.wk.crunchw{background:rgba(255,92,122,.13);border-color:rgba(255,92,122,.4)}
.wk.brkw{background:rgba(84,232,143,.11);border-color:rgba(84,232,143,.35)}
.wk.finalw{background:rgba(67,214,240,.1);border-color:rgba(67,214,240,.4)}
.wk.thisw{border-color:rgba(67,214,240,.6);box-shadow:0 0 18px rgba(67,214,240,.22)}
.wk .wlab .n{font-weight:700;font-size:13px}
.wk .wlab .d{font-size:10px;color:var(--faint);font-weight:400}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.bd{font-size:10.5px;font-weight:600;border-radius:8px;padding:4px 10px;color:#101433;box-shadow:0 3px 10px rgba(10,12,40,.25)}
.bd.w{color:#fff}
.bd.quiet{background:transparent;color:var(--mut);border:1px solid var(--stroke);font-weight:400;box-shadow:none}
/* ---- mobile ---- */
@media(max-width:640px){
  body{padding:16px 10px 40px}
  .tabs{width:100%}
  .tab{flex:1;padding:9px 0;font-size:12.5px;text-align:center}
  .legend{gap:5px}.lg{padding:4px 10px;font-size:10px}
  /* week: snap-scroll one day at a time, time ruler stays pinned left.
     width:max-content makes the grid box span its tracks — sticky items clamp to the grid box */
  .wkgrid{min-width:0;width:max-content;grid-template-columns:44px repeat(7,min(80vw,340px))}
  .wkscroll{scroll-snap-type:x mandatory;scroll-padding-left:44px;-webkit-overflow-scrolling:touch}
  .dh,.col{scroll-snap-align:start}
  .blk{backdrop-filter:none;-webkit-backdrop-filter:none}
  .blob{filter:blur(46px)}
  .mgrid{gap:4px}
  .cell{min-height:58px;padding:6px;border-radius:10px}
  .pill{display:none}
  .mtitle{font-size:18px}.nbtn{width:34px;height:34px}
  .wk{grid-template-columns:1fr;gap:7px;padding:12px 13px}
  /* day panel becomes a bottom sheet */
  .drawer{top:auto;left:10px;right:10px;bottom:10px;width:auto;max-height:76vh;
    transform:translateY(calc(100% + 90px));padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
  .drawer.on{transform:none}
}

/* ---- floating tooltip ---- */
#tip{position:fixed;z-index:80;max-width:320px;pointer-events:none;opacity:0;transform:translateY(6px);transition:opacity .14s, transform .14s;
  background:linear-gradient(160deg,rgba(58,46,110,.96),rgba(24,38,92,.96));backdrop-filter:blur(20px);
  border:1px solid var(--stroke);border-top-color:var(--stroke-hi);border-radius:16px;padding:13px 15px;
  box-shadow:0 16px 44px rgba(5,8,30,.65);font-size:11.5px;line-height:1.45}
#tip.on{opacity:1;transform:none}
#tip .tp-cat{font-size:9px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;margin-bottom:3px}
#tip .tp-title{font-weight:700;font-size:13.5px;line-height:1.2}
#tip .tp-sub{font-size:10px;color:var(--mut);font-weight:400;margin:2px 0 8px}
#tip .tp-row{display:flex;gap:8px;margin-top:4px}
#tip .tp-row b{flex:none;width:62px;font-weight:600;font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;padding-top:1px}
#tip .tp-row span{font-weight:400;font-size:11px}
#tip .tp-note{margin-top:9px;padding-top:8px;border-top:1px solid rgba(255,255,255,.14);font-size:10.5px;color:var(--mut);font-weight:400}
#tip .tp-ev{display:flex;gap:8px;margin-top:4px;align-items:baseline}
#tip .tp-ev i{width:6px;height:6px;border-radius:50%;flex:none;box-shadow:0 0 6px currentColor;align-self:center}
#tip .tp-ev .tv{font-size:11px;font-weight:500}
#tip .tp-ev .tm2{font-size:9.5px;color:var(--faint);font-weight:400;margin-left:auto;padding-left:10px;white-space:nowrap}
#tip .tp-pill{display:inline-block;font-size:9.5px;font-weight:600;border-radius:6px;padding:2px 8px;margin:2px 4px 2px 0;color:#101433}
/* pinned state: click/tap a block to keep the card up; click away, ✕, or Esc dismisses */
#tipx{display:none;position:absolute;top:9px;right:9px;width:26px;height:26px;border-radius:8px;border:1px solid var(--stroke);
  background:rgba(255,255,255,.1);color:#fff;font-size:11px;cursor:pointer;font-family:inherit;line-height:1}
#tip.pinned{pointer-events:auto;user-select:text;-webkit-user-select:text;max-height:64vh;overflow-y:auto;overscroll-behavior:contain}
/* sticky float keeps the ✕ visible while a long card scrolls */
#tip.pinned #tipx{display:block;position:sticky;top:0;right:auto;float:right;margin:-2px -4px 6px 8px}
#tip.pinned .tp-title{padding-right:30px}
@media(max-width:640px){
  #tip.pinned{left:10px !important;right:10px;top:auto !important;bottom:calc(10px + env(safe-area-inset-bottom,0px));
    max-width:none;max-height:58vh;border-radius:18px;box-shadow:0 -10px 50px rgba(5,8,30,.7)}
}
</style>
</head>
<body>
<div class="bgfx">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <svg class="ribbon" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#43D6F0" stop-opacity=".7"/>
        <stop offset=".5" stop-color="#4A7DFF" stop-opacity=".45"/>
        <stop offset="1" stop-color="#8A6CFF" stop-opacity=".55"/>
      </linearGradient>
      <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
    </defs>
    <path d="M-100,180 C300,60 480,420 820,300 S1250,80 1560,260" fill="none" stroke="url(#rg)" stroke-width="54" stroke-linecap="round" filter="url(#soft)" opacity=".5"/>
    <path d="M-80,760 C340,880 620,560 940,700 S1300,880 1560,720" fill="none" stroke="url(#rg)" stroke-width="44" stroke-linecap="round" filter="url(#soft)" opacity=".35"/>
  </svg>
</div>

<div class="shell">
  <div class="eyebrow">CMU · Fall 2026</div>
  <h1>The System</h1>
  <div class="sub">Five courses · 21 hr startup · ~8 hr research · gym every day · lights out 11:15</div>
  <div class="chiprow"><div class="countdown" id="cd"></div><div class="countdown" id="nowchip"></div></div>

  <div class="tabs">
    <button class="tab on" data-v="week">Week</button>
    <button class="tab" data-v="month">Month</button>
    <button class="tab" data-v="sem">Semester</button>
  </div>

  <section class="view on" id="v-week">
    <div class="legend" id="legend"></div>
    <div class="mhead">
      <div class="mtitle" id="wtitle"></div>
      <div class="nav"><button class="nbtn" id="wprev">‹</button><button class="nbtn wide" id="wtoday">Today</button><button class="nbtn" id="wnext">›</button></div>
    </div>
    <div class="wkwrap glass"><div class="wkscroll"><div class="wkgrid" id="wkgrid"></div></div></div>
  </section>

  <section class="view" id="v-month">
    <div class="mhead">
      <div class="mtitle" id="mtitle"></div>
      <div class="nav"><button class="nbtn" id="prev">‹</button><button class="nbtn" id="next">›</button></div>
    </div>
    <div class="mgrid" id="mgrid"></div>
  </section>

  <section class="view" id="v-sem"><div class="sem" id="semlist"></div></section>
</div>

<div class="ov" id="ov"></div>
<div id="tip"></div>
<aside class="drawer" id="drawer">
  <button class="dr-x" id="drx">✕</button>
  <div class="dr-date" id="drdate"></div>
  <div class="dr-sub" id="drsub"></div>
  <div id="drbody"></div>
</aside>

<script src="data.js"></script>
<script>
const TODAY=new Date(2026,7,23);
const NOW=new Date(); const REF = NOW>TODAY?NOW:TODAY;
const colors={class:'#FF5C7A',study:'#5B9BFF',research:'#B07CFF',startup:'#43E0C0',gym:'#54E88F',personal:'rgba(255,255,255,.55)',transit:'rgba(255,255,255,.3)'};
const catNames={class:'Classes',study:'Study',research:'Research',startup:'Startup',gym:'Gym',personal:'Personal'};
const T=(h,m=0)=>h+m/60;
const fmtT=x=>{let h=Math.floor(x),m=Math.round((x-h)*60);const ap=h>=12?'PM':'AM';h=((h+11)%12)+1;return h+':'+String(m).padStart(2,'0')+' '+ap;};

const week=window.CAL.week;

const noClassAll=new Set(window.CAL.noClassAll);
const noDaytime=new Set(window.CAL.noDaytime);
const breakDays=new Set([...noClassAll,'2026-11-03']);
const P=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const semStart=P(window.CAL.semStart), semEnd=new Date(2026,11,15);

const S=window.CAL.S;
const crunch=new Set(window.CAL.crunch);

const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const inSem=d=>d>=semStart&&d<=P(window.CAL.semEnd);

function dayEvents(d){
  const k=key(d),dow=d.getDay();
  let ev=(week[dow]||[]).slice();
  if(inSem(d)){
    if(noClassAll.has(k)) ev=ev.filter(e=>e[2]!=='class');
    if(noDaytime.has(k)) ev=ev.filter(e=>e[2]!=='class'||e[0]>=17);
  } else { ev=ev.filter(e=>e[2]!=='class'); }
  return ev;
}

(function(){
  const first=new Date(2026,7,24);
  const days=Math.ceil((first-REF)/86400000);
  const el=document.getElementById('cd');
  if(days>0) el.innerHTML=`Classes start in <b>${days} day${days>1?'s':''}</b> · Mon Aug 24`;
  else{
    const nexts=Object.keys(S).map(k=>new Date(k+'T12:00:00')).filter(d=>d>=REF&&S[key(d)][0].k==='exam').sort((a,b)=>a-b)[0];
    el.innerHTML=nexts?`Next exam · <b>${nexts.toLocaleDateString('en-US',{month:'short',day:'numeric'})}</b>`:'Semester complete ✨';
  }
})();

document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+b.dataset.v));
});

/* WEEK */
(function(){
  const lg=document.getElementById('legend');
  for(const k of ['class','study','research','startup','gym','personal'])
    lg.insertAdjacentHTML('beforeend',`<span class="lg"><i style="background:${colors[k]};color:${colors[k]}"></i>${catNames[k]}</span>`);
  const START=6,END=23.75,H=46,g=document.getElementById('wkgrid'),colH=(END-START)*H;
  const names=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  const themes=['deep work · gym AM','marathon · short gym','research live','short gym · research','241 HW due 5 PM','startup deep work','reset + research'];
  const fmtMD=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  const mondayOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;};
  const WKMIN=mondayOf(new Date(2026,7,17)),WKMAX=mondayOf(new Date(2026,11,20));
  const clampWk=d=>new Date(Math.min(Math.max(+d,+WKMIN),+WKMAX));
  let wkStart=clampWk(mondayOf(NOW));
  const nowline=document.createElement('div');nowline.className='nowline';

  function renderWeek(){
    g.innerHTML='';
    const days=[];for(let i=0;i<7;i++){const d=new Date(wkStart);d.setDate(d.getDate()+i);days.push(d);}
    const wn=Math.round((wkStart-mondayOf(semStart))/6048e5)+1;
    document.getElementById('wtitle').textContent=`${fmtMD(days[0])} – ${fmtMD(days[6])}`+(wn>=1&&wn<=17?` · Week ${wn}`:'');
    g.insertAdjacentHTML('beforeend','<div class="corner"></div>');
    days.forEach((d,i)=>{
      const k=key(d);let tags='';
      if(crunch.has(k))tags+='<span class="tag cr">CRUNCH</span>';
      if(noClassAll.has(k))tags+='<span class="tag noclass">No classes</span>';
      if(noDaytime.has(k))tags+='<span class="tag eve">Evening only</span>';
      const allday=(S[k]||[]).filter(ev=>ev.s==null).map(ev=>`<span class="evp p-${ev.k}">${ev.t}</span>`).join('');
      g.insertAdjacentHTML('beforeend',`<div class="dh" data-date="${k}"><div class="d">${names[i]}<span class="dd">${fmtMD(d)}</span></div><div class="th">${themes[i]}</div>${tags}${allday}</div>`);
    });
    const r=document.createElement('div');r.className='ruler';r.style.height=colH+'px';
    for(let h=START;h<=23;h++)r.insertAdjacentHTML('beforeend',`<div class="hl" style="top:${(h-START)*H}px">${h===12?'12P':h<12?h+'A':(h-12)+'P'}</div>`);
    g.appendChild(r);
    days.forEach((d,i)=>{
      const k=key(d);
      const c=document.createElement('div');c.className='col';c.dataset.date=k;c.style.height=colH+'px';
      for(let h=START;h<=23;h++)c.insertAdjacentHTML('beforeend',`<div class="gl" style="top:${(h-START)*H}px"></div>`);
      const sl=i===5?23.5:i===6?22.5:23.25;
      c.insertAdjacentHTML('beforeend',`<div class="sleep" style="top:${(sl-START)*H}px"></div>`);
      for(const [s,e,cat,t,m] of dayEvents(d)){
        const top=(s-START)*H,ht=(e-s)*H-2,thin=ht<24?'thin':'';
        c.insertAdjacentHTML('beforeend',`<div class="blk c-${cat} ${thin}" style="top:${top}px;height:${ht}px" data-k="${t}" data-time="${fmtT(s)} – ${fmtT(e)}" data-cat="${cat}" data-s="${s}" data-e="${e}"><div class="t">${t}</div>${m&&!thin?`<div class="m">${m}</div>`:''}</div>`);
      }
      (S[k]||[]).filter(ev=>ev.s!=null).forEach(ev=>{
        const es=ev.s,ee=es+(ev.d||60)/60;
        const top=(es-START)*H,ht=Math.max((ee-es)*H-2,16);
        c.insertAdjacentHTML('beforeend',`<div class="evblk ek-${ev.k}" style="top:${top}px;height:${ht}px" data-title="${ev.t}" data-time="${fmtT(es)} – ${fmtT(ee)}" data-loc="${ev.loc||''}" data-kind="${ev.k}"><div class="t">${ev.t}</div>${ht>=26?`<div class="m">${fmtT(es)}</div>`:''}</div>`);
      });
      g.appendChild(c);
    });
    // on phones the week scrolls one day per swipe — land on today (this week) or Monday
    requestAnimationFrame(()=>{
      const sc=document.querySelector('.wkscroll');
      if(sc.scrollWidth<=sc.clientWidth+8)return;
      const cols=g.querySelectorAll('.col'),ti=days.findIndex(d=>key(d)===key(new Date()));
      sc.scrollLeft=ti>0?cols[ti].offsetLeft-cols[0].offsetLeft:0;
    });
    updateNow();
  }

  /* live "now" awareness: today's header lit, a time line in today's column,
     the active block pulsing, and a Now/Up-next chip in the header */
  function updateNow(){
    const now=new Date(),k=key(now),t=now.getHours()+now.getMinutes()/60;
    g.querySelectorAll('.dh').forEach(d=>d.classList.toggle('today',d.dataset.date===k));
    g.querySelectorAll('.blk.now').forEach(b=>b.classList.remove('now'));
    nowline.remove();
    const col=g.querySelector(`.col[data-date="${k}"]`);
    if(col&&t>=START&&t<=END){
      nowline.style.top=((t-START)*H)+'px';
      col.appendChild(nowline);
      col.querySelectorAll('.blk').forEach(b=>{if(t>=+b.dataset.s&&t<+b.dataset.e)b.classList.add('now');});
    }
    const ev=dayEvents(now).filter(e=>e[2]!=='transit');
    const cur=ev.find(e=>t>=e[0]&&t<e[1]);
    const nxt=ev.find(e=>e[0]>t);
    const chip=document.getElementById('nowchip');
    if(cur)chip.innerHTML=`Now · <b>${cur[3]}</b> · until ${fmtT(cur[1])}`;
    else if(nxt)chip.innerHTML=`Up next · <b>${nxt[3]}</b> · ${fmtT(nxt[0])}`;
    else chip.innerHTML='';
  }

  document.getElementById('wprev').onclick=()=>{const n=new Date(wkStart);n.setDate(n.getDate()-7);if(n>=WKMIN){wkStart=n;renderWeek();}};
  document.getElementById('wnext').onclick=()=>{const n=new Date(wkStart);n.setDate(n.getDate()+7);if(n<=WKMAX){wkStart=n;renderWeek();}};
  document.getElementById('wtoday').onclick=()=>{wkStart=clampWk(mondayOf(new Date()));renderWeek();};
  renderWeek();setInterval(updateNow,30000);
})();

/* MONTH */
let mView=new Date(REF.getFullYear(),REF.getMonth(),1);
if(mView<new Date(2026,7,1))mView=new Date(2026,7,1);
const MIN=new Date(2026,7,1),MAX=new Date(2027,0,1);
function renderMonth(){
  const y=mView.getFullYear(),mo=mView.getMonth();
  document.getElementById('mtitle').textContent=mView.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const g=document.getElementById('mgrid');g.innerHTML='';
  ['SUN','MON','TUE','WED','THU','FRI','SAT'].forEach(d=>g.insertAdjacentHTML('beforeend',`<div class="dow">${d}</div>`));
  const first=new Date(y,mo,1),startPad=first.getDay(),dim=new Date(y,mo+1,0).getDate();
  for(let i=0;i<startPad;i++)g.insertAdjacentHTML('beforeend','<div></div>');
  for(let d=1;d<=dim;d++){
    const dt=new Date(y,mo,d),k=key(dt);
    const sp=S[k]||[];
    const cls=['cell'];
    if(key(REF)===k)cls.push('today');
    if(breakDays.has(k))cls.push('brkday');
    if(crunch.has(k))cls.push('crunch');
    const cats=[...new Set(dayEvents(dt).map(e=>e[2]))].filter(c=>c!=='transit'&&c!=='personal').slice(0,5);
    const pills=sp.slice(0,2).map(s=>`<span class="pill p-${s.k}">${s.t}</span>`).join('');
    const dots=cats.length?`<div class="dots">${cats.map(c=>`<i style="background:${colors[c]};color:${colors[c]}"></i>`).join('')}</div>`:'';
    const el=document.createElement('div');el.className=cls.join(' ');
    el.dataset.date=k;
    el.innerHTML=`<div class="num">${d}</div>${pills}${dots}`;
    el.onclick=()=>openDay(dt);
    g.appendChild(el);
  }
}
document.getElementById('prev').onclick=()=>{const n=new Date(mView.getFullYear(),mView.getMonth()-1,1);if(n>=MIN){mView=n;renderMonth();}};
document.getElementById('next').onclick=()=>{const n=new Date(mView.getFullYear(),mView.getMonth()+1,1);if(n<=MAX){mView=n;renderMonth();}};
renderMonth();

/* drawer */
const ov=document.getElementById('ov'),dr=document.getElementById('drawer');
function closeD(){ov.classList.remove('on');dr.classList.remove('on');}
ov.onclick=closeD;document.getElementById('drx').onclick=closeD;
function openDay(dt){
  const k=key(dt);
  document.getElementById('drdate').textContent=dt.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  const notes=[];
  if(noClassAll.has(k))notes.push('No classes');
  if(noDaytime.has(k))notes.push('No daytime classes — 15-122 evening meets');
  if(crunch.has(k))notes.push('CRUNCH WEEK — startup at check-in level');
  document.getElementById('drsub').textContent=notes.join(' · ')||'Standard system day';
  const b=document.getElementById('drbody');b.innerHTML='';
  const sp=S[k]||[];
  if(sp.length){
    b.insertAdjacentHTML('beforeend','<div class="dr-sec">Key dates</div>');
    const kc={exam:'var(--exam)',hw:'var(--hw)',brk:'var(--brk)',fly:'var(--fly)',adm:'rgba(255,255,255,.28)',mile:'var(--mile)'};
    const wt={exam:'#fff',hw:'#fff',adm:'#fff'};
    sp.forEach(s=>b.insertAdjacentHTML('beforeend',`<div class="dr-pill" style="background:${kc[s.k]};color:${wt[s.k]||'#101433'}">${s.t}${s.s!=null?' · '+fmtT(s.s):''}</div>`));
  }
  const ev=dayEvents(dt);
  b.insertAdjacentHTML('beforeend','<div class="dr-sec">Schedule</div>');
  if(!ev.length){b.insertAdjacentHTML('beforeend','<div class="dr-none">Nothing templated — off the system today.</div>');}
  ev.forEach(([s,e,cat,t,m])=>{
    b.insertAdjacentHTML('beforeend',`<div class="dr-ev"><i style="background:${colors[cat]};color:${colors[cat]}"></i><div><div class="tt">${t}${m?' · <span style="font-weight:400;color:var(--mut)">'+m+'</span>':''}</div><div class="tm">${fmtT(s)} – ${fmtT(e)}</div></div></div>`);
  });
  ov.classList.add('on');dr.classList.add('on');
}

/* SEMESTER */
const semMeta=[];
(function(){
  const list=document.getElementById('semlist');
  const weeks=[];
  let cur=new Date(2026,7,24);
  const end=new Date(2026,11,20);
  let n=1;
  while(cur<end){
    const wkEnd=new Date(cur);wkEnd.setDate(wkEnd.getDate()+6);
    weeks.push({n:n++,s:new Date(cur),e:wkEnd});
    cur.setDate(cur.getDate()+7);
  }
  const kc={exam:'var(--exam)',hw:'var(--hw)',brk:'var(--brk)',fly:'var(--fly)',adm:'rgba(255,255,255,.28)',mile:'var(--mile)'};
  const wcls={exam:'w',hw:'w',adm:'w'};
  const fmt=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  weeks.forEach((w,wi)=>{
    let badges=[],isCr=false,isBr=false,isFin=false,items=[];
    for(let d=new Date(w.s);d<=w.e;d.setDate(d.getDate()+1)){
      const k=key(d);
      if(crunch.has(k))isCr=true;
      if(k>='2026-10-12'&&k<='2026-10-16')isBr=true;
      if(k>='2026-12-07')isFin=true;
      (S[k]||[]).forEach(s=>{
        items.push({d:fmt(d),t:s.t,k:s.k});
        if(s.k!=='brk'||s.t.includes('Fall')||s.t.includes('Thanksgiving')||s.t.includes('Democracy')||s.t.includes('Labor'))badges.push(`<span class="bd ${wcls[s.k]||''}" style="background:${kc[s.k]}">${fmt(d)} · ${s.t}</span>`)});
    }
    badges=[...new Set(badges)];
    if(!badges.length)badges.push('<span class="bd quiet">Standard rhythm — quiz Tue · 241 HW Fri</span>');
    semMeta[wi]={n:w.n,range:fmt(w.s)+' – '+fmt(w.e),items,isCr,isBr,isFin};
    const cls=['wk'];if(isCr)cls.push('crunchw');if(isBr)cls.push('brkw');if(isFin)cls.push('finalw');
    if(NOW>=w.s&&NOW<new Date(w.e.getFullYear(),w.e.getMonth(),w.e.getDate()+1))cls.push('thisw');
    list.insertAdjacentHTML('beforeend',`<div class="${cls.join(' ')}" data-wi="${wi}"><div class="wlab"><div class="n">Week ${w.n}</div><div class="d">${fmt(w.s)} – ${fmt(w.e)}</div></div><div class="badges">${badges.join('')}</div></div>`);
  });
})();

/* ================= TOOLTIP ENGINE ================= */
const INFO=window.CAL.INFO;INFO['Lights out 11:15']=INFO['Lights out'];

const tip=document.getElementById('tip');
const TOUCH=matchMedia('(hover: none)').matches;
let pinned=false;
const catColor={class:'var(--class)',study:'var(--study)',research:'var(--research)',startup:'var(--startup)',gym:'var(--gym)',personal:'rgba(255,255,255,.6)',transit:'rgba(255,255,255,.4)'};
function showTip(html){tip.innerHTML=html;tip.classList.add('on');}
function hideTip(){if(pinned)return;tip.classList.remove('on');}
function unpin(){pinned=false;pinAnchor=null;tip.classList.remove('on','pinned');tip.style.left='';tip.style.top='';}
const SHEET=matchMedia('(max-width: 640px)'); // must agree with the CSS breakpoint, not innerWidth
let pinAnchor=null,pinHTML='';
function pinTip(html,anchor){
  pinned=true;pinAnchor=anchor;pinHTML=html;
  tip.style.left='';tip.style.top='';   // clear stale offsets BEFORE measuring, or width is clamped
  tip.innerHTML='<button id="tipx" aria-label="Close">✕</button>'+html;
  tip.classList.add('on','pinned');
  if(SHEET.matches)return;              // bottom sheet — CSS positions it
  const r=anchor.getBoundingClientRect(),w=tip.offsetWidth,h=tip.offsetHeight;
  let x=r.right+12,y=r.top;
  if(x+w>innerWidth-10)x=r.left-w-12;
  if(x<8){x=Math.min(Math.max(8,r.left),Math.max(8,innerWidth-w-8));y=r.bottom+10;}
  if(y+h>innerHeight-10)y=Math.max(8,innerHeight-h-10);
  tip.style.left=x+'px';tip.style.top=Math.max(8,y)+'px';
}
addEventListener('resize',()=>{if(pinned&&pinAnchor)pinTip(pinHTML,pinAnchor);}); // rotation / breakpoint crossing
function moveTip(e){
  const w=tip.offsetWidth,h=tip.offsetHeight;
  let x=e.clientX+16,y=e.clientY+18;
  if(x+w>innerWidth-10)x=e.clientX-w-14;
  if(y+h>innerHeight-10)y=e.clientY-h-14;
  tip.style.left=Math.max(8,x)+'px';tip.style.top=Math.max(8,y)+'px';
}
document.addEventListener('mousemove',e=>{if(!pinned&&tip.classList.contains('on'))moveTip(e);});

/* content builders — shared by hover and click-to-pin */
function blkHTML(b){
  const k=b.dataset.k,info=INFO[k],cat=b.dataset.cat;
  let html=`<div class="tp-cat" style="color:${catColor[cat]}">${catNames[cat]||cat}</div>
    <div class="tp-title">${k}</div><div class="tp-sub">${b.dataset.time}${info&&info.sub?' · '+info.sub:''}</div>`;
  if(info){
    (info.rows||[]).forEach(r=>html+=`<div class="tp-row"><b>${r[0]}</b><span>${r[1]}</span></div>`);
    if(info.note)html+=`<div class="tp-note">${info.note}</div>`;
  }
  return html;
}

/* week blocks + overlaid dated events */
document.getElementById('wkgrid').addEventListener('mouseover',e=>{
  if(TOUCH||pinned)return;
  const b=e.target.closest('.blk,.evblk');if(!b)return;
  showTip(b.classList.contains('evblk')?evHTML(b):blkHTML(b));moveTip(e);
});
document.getElementById('wkgrid').addEventListener('mouseout',e=>{if(e.target.closest('.blk,.evblk'))hideTip();});

/* month cells */
const kcT={exam:'var(--exam);color:#fff',hw:'var(--hw);color:#fff',brk:'var(--brk)',fly:'var(--fly)',adm:'rgba(255,255,255,.28);color:#fff',mile:'var(--mile)'};
document.getElementById('mgrid').addEventListener('mouseover',e=>{
  if(TOUCH||pinned)return;
  const c=e.target.closest('.cell');if(!c||!c.dataset.date)return;
  const k=c.dataset.date,dt=new Date(k+'T12:00:00');
  const sp=S[k]||[],ev=dayEvents(dt);
  let html=`<div class="tp-title">${dt.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}</div>`;
  const notes=[];
  if(noClassAll.has(k))notes.push('No classes');
  if(noDaytime.has(k))notes.push('No daytime classes — 122 evening meets');
  if(crunch.has(k))notes.push('CRUNCH WEEK');
  html+=`<div class="tp-sub">${notes.join(' · ')||'Standard system day'}</div>`;
  if(sp.length){sp.forEach(s=>html+=`<span class="tp-pill" style="background:${kcT[s.k]}">${s.t}${s.s!=null?' · '+fmtT(s.s):''}</span>`);}
  if(ev.length){
    html+='<div class="tp-note" style="margin-top:'+(sp.length?'9':'2')+'px;border-top:'+(sp.length?'1px solid rgba(255,255,255,.14)':'none')+';padding-top:'+(sp.length?'8':'0')+'px">';
    html+='</div>';
    ev.forEach(([s2,e2,cat,t])=>{
      html+=`<div class="tp-ev"><i style="background:${colors[cat]};color:${colors[cat]}"></i><span class="tv">${t}</span><span class="tm2">${fmtT(s2)}–${fmtT(e2)}</span></div>`;
    });
  } else html+='<div class="tp-note">Nothing templated — off the system today.</div>';
  html+='<div class="tp-note">Click for the full day panel</div>';
  showTip(html);moveTip(e);
});
document.getElementById('mgrid').addEventListener('mouseout',e=>{if(e.target.closest('.cell'))hideTip();});

/* overlaid one-off events (exams, meetings, deadlines) */
const kindNames={exam:'Exam',hw:'Homework due',brk:'Break',fly:'Flight',adm:'Deadline',mile:'Key event'};
function evHTML(b){
  let html=`<div class="tp-cat" style="color:${(kcT[b.dataset.kind]||'').split(';')[0]||'var(--mile)'}">${kindNames[b.dataset.kind]||'Event'}</div>
    <div class="tp-title">${b.dataset.title}</div><div class="tp-sub">${b.dataset.time}</div>`;
  if(b.dataset.loc)html+=`<div class="tp-row"><b>Where</b><span>${b.dataset.loc}</span></div>`;
  return html;
}

/* semester rows */
function wkRowHTML(r){
  const m=semMeta[+r.dataset.wi];if(!m)return '';
  let html=`<div class="tp-title">Week ${m.n}</div><div class="tp-sub">${m.range}</div>`;
  if(m.isCr)html+=`<span class="tp-pill" style="background:var(--exam);color:#fff">CRUNCH — startup at check-in level</span>`;
  if(m.isBr)html+=`<span class="tp-pill" style="background:var(--brk)">Fall Break — Austin, family, remote startup</span>`;
  if(m.isFin)html+=`<span class="tp-pill" style="background:var(--fly)">Finals — startup paused</span>`;
  if(m.items.length){
    m.items.forEach(it=>html+=`<div class="tp-ev"><i style="background:${(kcT[it.k]||'').split(';')[0]||'rgba(255,255,255,.4)'};color:#fff"></i><span class="tv">${it.t}</span><span class="tm2">${it.d}</span></div>`);
  }
  html+=`<div class="tp-note">Standing rhythm: 241 quiz Tue 4 PM · 241 HW Fri 5 PM · 151 HW LaTeX draft Sun · research Wed/Thu/Fri/Sun · gym daily · startup nightly</div>`;
  return html;
}
document.getElementById('semlist').addEventListener('mouseover',e=>{
  if(TOUCH||pinned)return;
  const r=e.target.closest('.wk');if(!r)return;
  const html=wkRowHTML(r);if(!html)return;
  showTip(html);moveTip(e);
});
document.getElementById('semlist').addEventListener('mouseout',e=>{if(e.target.closest('.wk'))hideTip();});

/* click / tap to pin — the card stays for reference until you click away, hit ✕, or press Esc */
let downInTip=false; // a text-selection drag that starts in the card must not dismiss it on release
document.addEventListener('pointerdown',e=>{downInTip=tip.contains(e.target);});
document.addEventListener('click',e=>{
  if(e.target.closest('#tipx')){unpin();return;}
  if(tip.contains(e.target)||downInTip)return;
  const a=e.target.closest('.blk,.evblk,.wk');
  if(!a){if(pinned)unpin();return;}
  const html=a.classList.contains('blk')?blkHTML(a):a.classList.contains('evblk')?evHTML(a):wkRowHTML(a);
  if(html)pinTip(html,a);else unpin();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){unpin();closeD();}});
</script>
</body>
</html>
