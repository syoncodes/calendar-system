# ============================================================
# EVENTS + ACADEMIC CALENDAR CONFIG
# This is where new assignments, exams, meetings, and date changes go.
# kinds: exam | hw | brk (break/holiday) | fly (travel) | adm (admin deadline) | mile (milestone)
# Timed events: add time ("HH:MM"), duration_min, location.
# Dateless recurring rules live in schedule.yaml, not here.
# After editing, run:  python scripts/build.py
# ============================================================

config:
